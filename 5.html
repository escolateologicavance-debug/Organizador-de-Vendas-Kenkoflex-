<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lembretes Gerais</title>
<style>
:root {
--primary: #2563eb;
--primary-hover: #1d4ed8;
--bg-color: #f8fafc;
--card-bg: #ffffff;
--text-main: #1e293b;
--text-muted: #64748b;
--border-color: #e2e8f0;
--danger: #ef4444;
--danger-hover: #dc2626;
--success: #22c55e;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
}

body {
background-color: var(--bg-color);
color: var(--text-main);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
}

.container {
width: 100%;
max-width: 600px;
background-color: var(--card-bg);
border-radius: 12px;
box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
padding: 24px;
display: flex;
flex-direction: column;
gap: 20px;
}

h1 {
font-size: 1.5rem;
text-align: center;
color: var(--text-main);
}

.input-group {
display: flex;
gap: 10px;
}

input[type="text"] {
flex: 1;
padding: 12px 16px;
border: 1px solid var(--border-color);
border-radius: 8px;
font-size: 1rem;
outline: none;
transition: border-color 0.2s;
}

input[type="text"]:focus {
border-color: var(--primary);
}

button {
padding: 12px 20px;
border: none;
border-radius: 8px;
font-size: 1rem;
font-weight: 600;
cursor: pointer;
transition: background-color 0.2s, transform 0.1s;
}

button:active {
transform: scale(0.98);
}

.btn-primary {
background-color: var(--primary);
color: white;
}

.btn-primary:hover {
background-color: var(--primary-hover);
}

.btn-voice {
background-color: #f1f5f9;
color: var(--text-main);
border: 1px solid var(--border-color);
display: flex;
align-items: center;
justify-content: center;
gap: 8px;
}

.btn-voice:hover {
background-color: #e2e8f0;
}

.btn-voice.listening {
background-color: var(--danger);
color: white;
border-color: var(--danger);
animation: pulse 1.5s infinite;
}

@keyframes pulse {
0% { transform: scale(1); }
50% { transform: scale(1.05); }
100% { transform: scale(1.03); }
}

.status-msg {
font-size: 0.875rem;
color: var(--text-muted);
text-align: center;
min-height: 20px;
}

.reminders-list {
list-style: none;
display: flex;
flex-direction: column;
gap: 10px;
max-height: 400px;
overflow-y: auto;
}

.reminder-item {
display: flex;
justify-content: space-between;
align-items: center;
padding: 12px 16px;
background-color: #f8fafc;
border: 1px solid var(--border-color);
border-radius: 8px;
gap: 10px;
animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
from { opacity: 0; transform: translateY(-5px); }
to { opacity: 1; transform: translateY(0); }
}

.reminder-item.completed span {
text-decoration: line-through;
color: var(--text-muted);
}

.reminder-content {
display: flex;
align-items: center;
gap: 12px;
flex: 1;
cursor: pointer;
word-break: break-word;
}

.reminder-content input[type="checkbox"] {
width: 18px;
height: 18px;
cursor: pointer;
}

.btn-delete {
background: none;
border: none;
color: var(--danger);
cursor: pointer;
padding: 4px 8px;
border-radius: 4px;
font-size: 0.875rem;
}

.btn-delete:hover {
background-color: #fee2e2;
}

.empty-state {
text-align: center;
color: var(--text-muted);
padding: 20px 0;
font-style: italic;
}
</style>
</head>
<body>

<div class="container">
<h1>Lembretes Gerais</h1>

<div class="input-group">
<input type="text" id="reminderInput" placeholder="Digite ou fale seu lembrete...">
<button class="btn-primary" id="addBtn">Adicionar</button>
<button class="btn-voice" id="voiceBtn" title="Comando por voz">
🎤 Falar
</button>
</div>

<div class="status-msg" id="statusMsg"></div>

<ul class="reminders-list" id="remindersList">
<!-- Os lembretes entram aqui dinamicamente -->
</ul>
</div>

<script>
const reminderInput = document.getElementById('reminderInput');
const addBtn = document.getElementById('addBtn');
const voiceBtn = document.getElementById('voiceBtn');
const remindersList = document.getElementById('remindersList');
const statusMsg = document.getElementById('statusMsg');

let reminders = JSON.parse(localStorage.getItem('general_reminders')) || [];

function saveAndRender() {
localStorage.setItem('general_reminders', JSON.stringify(reminders));
renderReminders();
}

function addReminder(text) {
if (!text.trim()) return;
reminders.unshift({
id: Date.now(),
text: text.trim(),
completed: false
});
saveAndRender();
reminderInput.value = '';
}

function toggleReminder(id) {
reminders = reminders.map(item => {
if (item.id === id) {
return { ...item, completed: !item.completed };
}
return item;
});
saveAndRender();
}

function deleteReminder(id) {
reminders = reminders.filter(item => item.id !== id);
saveAndRender();
}

function renderReminders() {
remindersList.innerHTML = '';

if (reminders.length === 0) {
remindersList.innerHTML = '<li class="empty-state">Nenhum lembrete cadastrado.</li>';
return;
}

reminders.forEach(item => {
const li = document.createElement('li');
li.className = reminder-item ${item.completed ? 'completed' : ''}`;

const contentDiv = document.createElement('div');
contentDiv.className = 'reminder-content';
contentDiv.onclick = () => toggleReminder(item.id);

const checkbox = document.createElement('input');
checkbox.type = 'checkbox';
checkbox.checked = item.completed;
checkbox.onclick = (e) => {
e.stopPropagation();
toggleReminder(item.id);
};

const span = document.createElement('span');
span.textContent = item.text;

contentDiv.appendChild(checkbox);
contentDiv.appendChild(span);

const deleteBtn = document.createElement('button');
deleteBtn.className = 'btn-delete';
deleteBtn.textContent = 'Excluir';
deleteBtn.onclick = (e) => {
e.stopPropagation();
deleteReminder(item.id);
};

li.appendChild(contentDiv);
li.appendChild(deleteBtn);
remindersList.appendChild(li);
});
}

// Eventos de clique tradicionais
addBtn.addEventListener('click', () => {
addReminder(reminderInput.value);
});

reminderInput.addEventListener('keypress', (e) => {
if (e.key === 'Enter') {
addReminder(reminderInput.value);
}
});

// Configuração do Reconhecimento de Voz (SpeechRecognition API)
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
voiceBtn.style.display = 'none';
statusMsg.textContent = 'Reconhecimento de voz não suportado neste navegador. Use o Chrome ou Edge.';
} else {
const recognition = new SpeechRecognition();
recognition.lang = 'pt-BR';
recognition.interimResults = false;
recognition.maxAlternatives = 1;

voiceBtn.addEventListener('click', () => {
try {
recognition.start();
} catch (e) {
// Evita erro caso já esteja ouvindo
recognition.stop();
}
});

recognition.addEventListener('start', () => {
voiceBtn.classList.add('listening');
voiceBtn.textContent = 'Ouvindo...';
statusMsg.textContent = 'Pode falar o seu lembrete...';
});

recognition.addEventListener('result', (e) => {
const speechResult = e.results[0][0].transcript;
reminderInput.value = speechResult;
addReminder(speechResult);
statusMsg.textContent = Registrado por voz: "${speechResult}"`;
});

recognition.addEventListener('error', (e) => {
statusMsg.textContent = Erro no reconhecimento de voz: ${e.error};
});

recognition.addEventListener('end', () => {
voiceBtn.classList.remove('listening');
voiceBtn.textContent = '🎤 Falar';
setTimeout(() => {
if (statusMsg.textContent.includes('Registrado') || statusMsg.textContent.includes('ouvindo')) {
statusMsg.textContent = '';
}
}, 4000);
});
}

// Carga inicial
renderReminders();
</script>
</body>
</html>
