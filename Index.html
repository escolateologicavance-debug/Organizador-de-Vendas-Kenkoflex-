<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle de Vendas e Estoque</title>

<!-- Logos já preparadas para o futuro PWA -->
<link rel="icon" type="image/png" sizes="192x192" href="logo-192.png">
<link rel="apple-touch-icon" href="logo-192.png">
<link rel="preload" as="image" href="logo-512.png">

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
min-height: 100vh;
font-family: Arial, Helvetica, sans-serif;
background: #f4f4f4;
color: #111;
}

.container {
width: 100%;
max-width: 900px;
margin: 0 auto;
padding: 25px 18px 35px;
}

/* CABEÇALHO */
header {
text-align: center;
margin-bottom: 28px;
}

.logo {
width: 192px;
height: 192px;
object-fit: contain;
display: block;
margin: 0 auto 18px;
}

header h1 {
margin: 0;
font-size: 24px;
font-weight: 700;
}

header p {
margin: 7px 0 0;
color: #666;
font-size: 14px;
}

/* MENU */
.menu {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 14px;
}

.item {
display: flex;
align-items: center;
min-height: 78px;
padding: 14px 16px;

background: #fff;
border: 1px solid #ddd;
border-radius: 12px;

text-decoration: none;
color: #111;

box-shadow: 0 2px 8px rgba(0,0,0,.06);

transition:
transform .15s ease,
box-shadow .15s ease;
}

.item:hover {
transform: translateY(-2px);
box-shadow: 0 5px 15px rgba(0,0,0,.10);
}

.numero {
width: 42px;
height: 42px;
flex: 0 0 42px;

display: flex;
align-items: center;
justify-content: center;

margin-right: 13px;

border-radius: 50%;
background: #111;
color: #fff;

font-size: 17px;
font-weight: bold;
}

.texto {
font-size: 16px;
font-weight: 700;
}

.bonus {
margin-top: 26px;
margin-bottom: 12px;

text-align: center;

font-size: 13px;
font-weight: bold;
color: #777;
text-transform: uppercase;
letter-spacing: .5px;
}

footer {
margin-top: 30px;
text-align: center;
color: #888;
font-size: 12px;
}

@media (max-width: 600px) {
.container {
padding: 18px 14px 30px;
}

.logo {
width: 150px;
height: 150px;
}

header h1 {
font-size: 21px;
}

.menu {
grid-template-columns: 1fr;
}

.item {
min-height: 72px;
}
}
</style>
</head>

<body>

<div class="container">

<!-- ==================================================
CABEÇALHO
=================================================== -->
<header>
<img
class="logo"
src="logo-192.png"
alt="Logo">

<h1>CONTROLE DE VENDAS</h1>
<p>Formulários e controles</p>
</header>

<!-- ==================================================
MENU PRINCIPAL
=================================================== -->
<main class="menu">

<span class="numero">1</span>
<span class="texto">Relação de Estoque</span>
</a>

<a class="item" href="2.html">

</a>

<a class="item" href="3.html">

<a class="item" href="4.html">

</a>

<a class="item" href="5.html">
<span class="numero">5</span>
<span class="texto">Lembretes Gerais</span>
</a>

</main>

<!-- ==================================================
2 BÔNUS
=================================================== -->
<div class="bonus">
+ 2 ferramentas bônus
</div>

<div class="menu">

<a class="item" href="6.html">
<span class="numero">6</span>

</a>

<a class="item" href="7.html">
<span class="numero">7</span>
<span class="texto">Controle de Comissões</span>
</a>

</div>

<footer>
Sistema de Controle • Formulários
</footer>

</div>

</html>
