<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenkoflex Contatos</title>
<style>
:root {
--primary: #2563eb;
--whatsapp: #25d366;
--whatsapp-hover: #22bf5b;
--bg-color: #f8fafc;
--card-bg: #ffffff;
--text-main: #1e293b;
--text-muted: #64748b;
--border-color: #e2e8f0;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
}

body {
background-color: var(--bg-color);
color: var(--text-main);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
}

.container {
width: 100%;
max-width: 500px;
background-color: var(--card-bg);
border-radius: 12px;
box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
padding: 24px;
display: flex;
flex-direction: column;
gap: 20px;
}

h1 {
font-size: 1.5rem;
text-align: center;
color: var(--text-main);
margin-bottom: 5px;
}

.subtitle {
text-align: center;
color: var(--text-muted);
font-size: 0.9rem;
margin-bottom: 10px;
}

.contacts-list {
display: flex;
flex-direction: column;
gap: 12px;
}

.contact-card {
display: flex;
justify-content: space-between;
align-items: center;
padding: 16px;
background-color: #f8fafc;
border: 1px solid var(--border-color);
border-radius: 10px;
transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.contact-card:hover {
transform: translateY(-2px);
box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.contact-info {
display: flex;
flex-direction: column;
gap: 4px;
}

.contact-name {
font-size: 1.1rem;
font-weight: 700;
color: var(--text-main);
}

.contact-phone {
font-size: 0.9rem;
color: var(--text-muted);
}

.btn-whatsapp {
display: flex;
align-items: center;
gap: 8px;
background-color: var(--whatsapp);
color: white;
text-decoration: none;
padding: 10px 16px;
border-radius: 8px;
font-weight: 600;
font-size: 0.95rem;
transition: background-color 0.2s, transform 0.1s;
box-shadow: 0 2px 5px rgba(37, 211, 102, 0.3);
}

.btn-whatsapp:hover {
background-color: var(--whatsapp-hover);
}

.btn-whatsapp:active {
transform: scale(0.98);
}

.whatsapp-icon {
width: 20px;
height: 20px;
fill: currentColor;
}

.back-link {
text-align: center;
margin-top: 10px;
}

.back-link a {
color: var(--primary);
text-decoration: none;
font-size: 0.9rem;
font-weight: 600;
}

.back-link a:hover {
text-decoration: underline;
}
</style>
</head>
