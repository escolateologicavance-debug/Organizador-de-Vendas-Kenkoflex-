<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Relação de Vendas</title>

<style>

/* =========================================================
CONFIGURAÇÃO DA FOLHA
========================================================= */

@page {
size: A4 portrait;
margin: 8mm;
}

* {
box-sizing: border-box;
}

body {
margin: 0;
padding: 0;
background: #ffffff;
color: #000000;
font-family: Arial, Helvetica, sans-serif;
}

/* =========================================================
FOLHA
========================================================= */

.folha {
width: 100%;
max-width: 194mm;
margin: 0 auto;
padding: 4mm 0;
}

/* =========================================================
CABEÇALHO PRINCIPAL
========================================================= */

.topo {
width: 100%;
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 3px;
}

.vendedor {
display: flex;
align-items: center;
flex: 1;
font-size: 11px;
font-weight: bold;
}

.linha-vendedor {
flex: 1;
margin-left: 4px;
border-bottom: 1px solid #000;
display: flex;
align-items: center;
}

.vendedor input {
width: 100%;
height: 22px;
border: none;
outline: none;
background: transparent;
font-family: Arial, Helvetica, sans-serif;
font-size: 11px;
font-weight: bold;
padding: 0 4px;
}

.vendas {
font-size: 17px;
font-weight: bold;
margin-left: 10px;
}

/* =========================================================
ÁREA SUPERIOR
========================================================= */

.area-superior {
width: 100%;
display: grid;
grid-template-columns: 70% 30%;
border-top: 1px solid #000;
}

/* =========================================================
TABELA DE CLIENTE (AGENDAMENTO / OUTROS)
========================================================= */

.cliente {
width: 100%;
border-collapse: collapse;
table-layout: fixed;
}

.cliente td {
border: 1px solid #000;
height: 32px;
text-align: center;
vertical-align: middle;
font-size: 10px;
padding: 0;
}

.cliente .titulo-coluna {
height: 33px;
font-size: 10px;
font-weight: bold;
background: #f1f5f9;
}

.cliente input {
width: 100%;
height: 30px;
border: none;
outline: none;
background: transparent;
text-align: center;
font-family: Arial, Helvetica, sans-serif;
font-size: 10px;
padding: 0 2px;
}

.col-data {
width: 15%;
}

.col-nome {
width: 52%;
}

.col-cidade {
width: 33%;
}

/* =========================================================
CAMPOS DO VEÍCULO (LATERAL)
========================================================= */

.dados {
border-left: 0;
display: flex;
flex-direction: column;
justify-content: space-between;
border-right: 1px solid #000;
border-bottom: 1px solid #000;
}

.dado {
height: 32px;
display: flex;
align-items: center;
padding: 0 6px;
font-size: 9px;
font-weight: bold;
border-bottom: 1px solid #000;
background: #f1f5f9;
}

.dado:last-child {
border-bottom: none;
}

.linha-dado {
flex: 1;
margin-left: 4px;
display: flex;
align-items: center;
}

.dado input {
width: 100%;
height: 24px;
border: none;
outline: none;
background: transparent;
font-family: Arial, Helvetica, sans-serif;
font-size: 9px;
font-weight: bold;
padding: 0 2px;
border-bottom: 1px solid #000;
}

/* =========================================================
TABELA PRINCIPAL DE VENDAS
========================================================= */

.tabela-vendas {
width: 100%;
border-collapse: collapse;
table-layout: fixed;
}

.tabela-vendas th,
.tabela-vendas td {
border: 1px solid #000;
padding: 0;
text-align: center;
vertical-align: middle;
}

/* =========================================================
CABEÇALHO DAS COLUNAS
========================================================= */

.tabela-vendas th {
height: 42px;
font-size: 8px;
line-height: 1.05;
font-weight: bold;
background: #f1f5f9;
}

/* =========================================================
LARGURA DAS COLUNAS
========================================================= */

.data { width: 10%; }
.nome { width: 35%; }
.cidade { width: 10%; }
.valor-venda { width: 8%; }
.valor-entrada { width: 8%; }
.qtde-parc { width: 7%; }
.valor-parcela { width: 8%; }
.chbl { width: 7%; }
.numero-colchao { width: 10%; }

/* =========================================================
LINHAS PARA PREENCHIMENTO
========================================================= */

.tabela-vendas td {
height: 27px;
font-size: 9px;
}

.tabela-vendas input {
width: 100%;
height: 26px;
border: none;
outline: none;
background: transparent;
text-align: center;
font-family: Arial, Helvetica, sans-serif;
font-size: 9px;
padding: 0 2px;
}

.tabela-vendas .campo-texto {
text-align: left;
padding-left: 3px;
}

/* =========================================================
BOTÕES E LINKS
========================================================= */

.botoes {
display: flex;
justify-content: center;
gap: 10px;
margin-top: 18px;
}

button {
border: 1px solid #000;
border-radius: 5px;
background: #000;
color: #fff;
padding: 10px 22px;
font-size: 14px;
cursor: pointer;
}

button.limpar {
background: #fff;
color: #000;
}

.back-link {
text-align: center;
margin-top: 15px;
}

.back-link a {
color: #2563eb;
text-decoration: none;
font-size: 14px;
font-weight: 600;
font-family: Arial, Helvetica, sans-serif;
}

.back-link a:hover {
text-decoration: underline;
}

/* =========================================================
RESPONSIVIDADE
========================================================= */

@media screen and (max-width: 600px) {
.folha {
width: 100%;
padding: 10px 5px;
}
.vendedor {
font-size: 10px;
}
.vendas {
font-size: 15px;
}
.cliente td,
.dado {
font-size: 8px;
}
.tabela-vendas th {
font-size: 7px;
}
.tabela-vendas td {
height: 28px;
}
.tabela-vendas input {
font-size: 8px;
}
}

/* =========================================================
IMPRESSÃO
========================================================= */

@media print {
body {
background: #fff;
}
.folha {
width: 100%;
max-width: none;
margin: 0;
padding: 0;
}
.botoes,
.back-link {
display: none;
}
input {
color: #000;
}
}

</style>

</head>
