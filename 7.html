<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diário de Bordo do Veículo</title>
<style>
:root {
--primary: #2563eb;
--primary-hover: #1d4ed8;
--whatsapp: #25d366;
--whatsapp-hover: #22bf5b;
--bg-color: #f8fafc;
--card-bg: #ffffff;
--text-main: #1e293b;
--text-muted: #64748b;
--border-color: #cbd5e1;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
}

body {
background-color: var(--bg-color);
color: var(--text-main);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 16px;
}

.container {
width: 100%;
max-width: 650px;
background-color: var(--card-bg);
border-radius: 12px;
box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
padding: 24px;
display: flex;
flex-direction: column;
gap: 20px;
}

h1 {
font-size: 1.5rem;
text-align: center;
color: var(--text-main);
border-bottom: 2px solid var(--border-color);
padding-bottom: 10px;
}

.section-title {
font-size: 1rem;
font-weight: 700;
color: var(--primary);
text-transform: uppercase;
letter-spacing: 0.5px;
margin-top: 5px;
margin-bottom: 8px;
border-left: 4px solid var(--primary);
padding-left: 8px;
}

.form-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 12px;
}

.full-width {
grid-column: span 2;
}

.input-group {
display: flex;
flex-direction: column;
gap: 4px;
}

label {
font-size: 0.85rem;
font-weight: 600;
color: var(--text-main);
}

input[type="text"],
input[type="number"],
input[type="date"],
textarea {
width: 100%;
padding: 10px 12px;
border: 1px solid var(--border-color);
border-radius: 6px;
font-size: 0.95rem;
outline: none;
transition: border-color 0.2s;
}

input:focus, textarea:focus {
border-color: var(--primary);
}

textarea {
resize: vertical;
min-height: 70px;
}

.checkbox-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 10px;
background-color: #f8fafc;
padding: 12px;
border-radius: 8px;
border: 1px solid var(--border-color);
}

.checkbox-item {
display: flex;
align-items: center;
gap: 8px;
font-size: 0.9rem;
cursor: pointer;
}

.checkbox-item input[type="checkbox"],
.checkbox-item input[type="radio"] {
width: 18px;
height: 18px;
cursor: pointer;
}

.support-card {
background-color: #f8fafc;
border: 1px solid var(--border-color);
border-radius: 8px;
padding: 12px 16px;
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 8px;
}

.support-info {
display: flex;
flex-direction: column;
}

.support-role {
font-size: 0.75rem;
font-weight: 700;
color: var(--text-muted);
text-transform: uppercase;
}

.support-name {
font-size: 1rem;
font-weight: 700;
color: var(--text-main);
}

.btn-whatsapp {
display: flex;
align-items: center;
gap: 6px;
background-color: var(--whatsapp);
color: white;
text-decoration: none;
padding: 8px 12px;
border-radius: 6px;
font-weight: 600;
font-size: 0.85rem;
transition: background-color 0.2s;
}

.btn-whatsapp:hover {
background-color: var(--whatsapp-hover);
}

.whatsapp-icon {
width: 16px;
height: 16px;
fill: currentColor;
}

.botoes {
display: flex;
justify-content: center;
gap: 12px;
margin-top: 10px;
}

button {
border: 1px solid #000;
border-radius: 6px;
background: #000;
color: #fff;
padding: 10px 22px;
font-size: 14px;
font-weight: 600;
cursor: pointer;
transition: background-color 0.2s;
}

button:hover {
background: #333;
}

button.limpar {
background: #fff;
color: #000;
border-color: var(--border-color);
}

button.limpar:hover {
background: #f1f5f9;
}

.back-link {
text-align: center;
margin-top: 10px;
}

.back-link a {
color: var(--primary);
text-decoration: none;
font-size: 0.9rem;
font-weight: 600;
}

.back-link a:hover {
text-decoration: underline;
}

@media print {
body {
background-color: #fff;
padding: 0;
}
.container {
box-shadow: none;
padding: 0;
max-width: 100%;
}
.botoes, .back-link {
display: none;
}
input, textarea {
border: none;
border-bottom: 1px solid #000;
border-radius: 0;
padding: 4px 0;
background: transparent;
}
.checkbox-grid {
border: none;
background: transparent;
padding: 0;
}
.support-card {
border: 1px solid #ccc;
break-inside: avoid;
}
}

@media (max-width: 500px) {
.form-grid {
grid-template-columns: 1fr;
}
.full-width {
grid-column: span 1;
}
.checkbox-grid {
grid-template-columns: 1fr;
}
.support-card {
flex-direction: column;
align-items: flex-start;
gap: 10px;
}
.btn-whatsapp {
width: 100%;
justify-content: center;
}
}
</style>
</head>
<body>

<form id="diarioForm" onsubmit="event.preventDefault();">
<!-- DADOS GERAIS -->
<div class="form-grid">

<label>Vendedor:</label>

<div class="input-group">

</div>
<div class="input-group">
<label>Data:</label>

<div class="input-group full-width">

</div>

<!-- REVISÃO PREVENTIVA -->
<div class="section-title" style="margin-top: 15px;">Revisão Preventiva</div>

<div class="form-grid" style="margin-bottom: 10px;">
<div class="input-group">
<label>Placa:</label>
<input type="text" placeholder="Placa">
</div>
<div class="input-group">

</div>

<div class="checkbox-grid">

<label class="checkbox-item"><input type="checkbox"> Filtro de Ar</label>

<label class="checkbox-item"><input type="checkbox"> Bomba d'Água</label>
</div>

<!-- AVARIAS -->
<div class="section-title" style="margin-top: 15px;">Verificação de Avarias</div>
<p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px;">
O carro apresenta alguma avaria? (Faróis queimados, palhetas, piscas, etc.)
</p>

<div class="form-grid">
<div class="input-group full-width" style="flex-direction: row; gap: 20px;">
<label class="checkbox-item"><input type="radio" name="avaria" value="nao" checked onclick="document.getElementById('qualAvaria').disabled = true;"> Não</label>
<label class="checkbox-item"><input type="radio" name="avaria" value="sim" onclick="document.getElementById('qualAvaria').disabled = false;"> Sim</label>
</div>
<div class="input-group full-width">
<label>Qual avaria?</label>
<input type="text" id="qualAvaria" placeholder="Descreva a avaria se houver..." disabled>
</div>
</div>

<!-- OBSERVAÇÕES -->
<div class="input-group full-width" style="margin-top: 12px;">
<label>Observações:</label>
<textarea placeholder="Outras observações importantes..."></textarea>
</div>
</form>

</div>
